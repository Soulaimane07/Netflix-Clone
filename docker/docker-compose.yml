version: "3.8"

services:
  frontend:
    build: ./front
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend

  backend:
    build: ./back
    ports:
      - "5000:5000"
    volumes:
      - ./back:/app
    environment:
      - NODE_ENV=production
